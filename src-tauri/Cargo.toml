[package]
name = "poser"
version = "3.1.0"
description = "Poser — floating panel that rigs Joysticks 'n Sliders-style pose controls in the Rive editor via its MCP server"
authors = ["IVG Design"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"

[profile.release]
strip = true
lto = true
